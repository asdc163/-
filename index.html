
<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SEEDANCE AGENT | 抖音自動化代理</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+TC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "tt-red":     "#FE2C55",
                        "tt-cyan":    "#25F4EE",
                        "tt-purple":  "#8B5CF6",
                        "tt-yellow":  "#FFD60A",
                        "tt-green":   "#00D85B",
                        "tt-orange":  "#FF7A00",
                        "tt-bg":      "#0a0a0a",
                        "tt-surface": "#161616",
                        "tt-card":    "#1e1e1e",
                        "tt-border":  "#2a2a2a",
                        "tt-border2": "#333333",
                        "tt-text":    "#FFFFFF",
                        "tt-muted":   "#888888",
                        "tt-dim":     "#555555",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"],
                        "body":    ["Inter", "Noto Sans TC", "sans-serif"],
                        "mono":    ["JetBrains Mono", "monospace"],
                    },
                    backgroundImage: {
                        'gradient-tt':      'linear-gradient(135deg, #FE2C55 0%, #25F4EE 100%)',
                        'gradient-ai':      'linear-gradient(135deg, #8B5CF6 0%, #25F4EE 100%)',
                        'gradient-fire':    'linear-gradient(135deg, #FF7A00 0%, #FE2C55 100%)',
                        'gradient-surface': 'linear-gradient(180deg, #1e1e1e 0%, #161616 100%)',
                    },
                    keyframes: {
                        'pulse-red': {
                            '0%, 100%': { boxShadow: '0 0 0 0 rgba(254,44,85,0.4)' },
                            '50%':      { boxShadow: '0 0 0 8px rgba(254,44,85,0)' },
                        },
                        'pulse-cyan': {
                            '0%, 100%': { boxShadow: '0 0 0 0 rgba(37,244,238,0.4)' },
                            '50%':      { boxShadow: '0 0 0 8px rgba(37,244,238,0)' },
                        },
                        'flow': {
                            '0%':   { backgroundPosition: '0% 50%' },
                            '100%': { backgroundPosition: '100% 50%' },
                        },
                        'scan': {
                            '0%':   { transform: 'translateY(-100%)' },
                            '100%': { transform: 'translateY(400%)' },
                        },
                        'blink': {
                            '0%, 100%': { opacity: '1' },
                            '50%':      { opacity: '0' },
                        },
                        'fade-in-up': {
                            '0%':   { opacity: '0', transform: 'translateY(16px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        'slide-in': {
                            '0%':   { opacity: '0', transform: 'translateX(-8px)' },
                            '100%': { opacity: '1', transform: 'translateX(0)' },
                        },
                        'spin-slow': {
                            '0%':   { transform: 'rotate(0deg)' },
                            '100%': { transform: 'rotate(360deg)' },
                        },
                    },
                    animation: {
                        'pulse-red':   'pulse-red 2s ease-in-out infinite',
                        'pulse-cyan':  'pulse-cyan 2s ease-in-out infinite',
                        'flow':        'flow 3s linear infinite',
                        'scan':        'scan 2s ease-in-out infinite',
                        'blink':       'blink 1s step-end infinite',
                        'fade-in-up':  'fade-in-up 0.4s ease-out forwards',
                        'slide-in':    'slide-in 0.3s ease-out forwards',
                        'spin-slow':   'spin-slow 3s linear infinite',
                    },
                },
            },
        }
    </script>
    <style>
        * { box-sizing: border-box; }
        body { overscroll-behavior-y: none; background: #0a0a0a; }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #161616; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

        .glow-red   { box-shadow: 0 0 20px rgba(254,44,85,0.35); }
        .glow-cyan  { box-shadow: 0 0 20px rgba(37,244,238,0.35); }
        .glow-purple{ box-shadow: 0 0 20px rgba(139,92,246,0.35); }
        .glow-green { box-shadow: 0 0 16px rgba(0,216,91,0.35); }

        .text-glow-red  { text-shadow: 0 0 20px rgba(254,44,85,0.6); }
        .text-glow-cyan { text-shadow: 0 0 20px rgba(37,244,238,0.6); }

        .bg-grid {
            background-image:
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .pipeline-connector {
            flex: 1;
            height: 2px;
            background: linear-gradient(90deg, var(--from-color, #333) 0%, var(--to-color, #333) 100%);
            position: relative;
            overflow: hidden;
        }
        .pipeline-connector.active::after {
            content: '';
            position: absolute;
            top: 0; left: -30px;
            width: 30px; height: 2px;
            background: linear-gradient(90deg, transparent, #FE2C55, transparent);
            animation: scan-x 1.5s ease-in-out infinite;
        }
        @keyframes scan-x {
            0%   { left: -30px; }
            100% { left: 100%; }
        }

        .progress-bar-animated {
            background: linear-gradient(90deg, #FE2C55, #8B5CF6, #25F4EE);
            background-size: 200% 100%;
            animation: flow 1.5s linear infinite;
        }

        @keyframes flow {
            0%   { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        .stage-glow-running {
            box-shadow: 0 0 0 1px rgba(254,44,85,0.5), 0 0 20px rgba(254,44,85,0.2);
        }
        .stage-glow-completed {
            box-shadow: 0 0 0 1px rgba(0,216,91,0.4), 0 0 16px rgba(0,216,91,0.15);
        }
        .heat-bar {
            height: 4px;
            border-radius: 2px;
            background: linear-gradient(90deg, #FF7A00, #FE2C55);
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.12.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
</head>
<body class="bg-tt-bg font-body text-tt-text">
    <div id="root"></div>
</body>
</html>
