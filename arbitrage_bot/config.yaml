# ============================================================
# Hyperliquid <> Aster Cross-Exchange Funding Rate Arbitrage
# Configuration File — 2026 Edition (Settlement-Scheduled)
# ============================================================
#
# SECURITY: Never commit real keys. Use key_encryptor.py to encrypt.
# Set password via:  export ARB_KEY_PASSWORD="your_password"
#
# SIMULATION MODE: Set simulation.enabled = true to run a full
# paper-trading simulation without placing any real orders.
# No keys are required in simulation mode.
# ============================================================

# ------------------------------------------------------------
# Hyperliquid
# REST + WebSocket. Auth via wallet private key (EIP-712).
# ------------------------------------------------------------
hyperliquid:
  api_url: "https://api.hyperliquid.xyz"
  ws_url: "wss://api.hyperliquid.xyz/ws"
  # Funding settles every 1 hour at the top of the hour (UTC).
  funding_interval_hours: 1
  # Run: python utils/key_encryptor.py to generate this value.
  # Leave empty when running in simulation mode.
  private_key_encrypted: ""
  wallet_address: ""

# ------------------------------------------------------------
# Aster DEX — Binance-compatible REST API
# Base URL: https://fapi.asterdex.com
# Auth: API Key + HMAC-SHA256 (like Binance Futures)
# ------------------------------------------------------------
aster:
  api_url: "https://fapi.asterdex.com"
  ws_url: "wss://fstream.asterdex.com"
  # Default funding interval for most perp pairs (BTC, ETH, SOL, etc.)
  # ASTER/USDT uses 4h — override via per-symbol fundingInfo if needed.
  default_funding_interval_hours: 8
  # Run: python utils/key_encryptor.py  (it will prompt for API key+secret)
  # Leave empty when running in simulation mode.
  api_key_encrypted: ""
  api_secret_encrypted: ""

# ------------------------------------------------------------
# Telegram — notifications on entry, settlement, and errors.
# Set enabled: false to disable all notifications.
# ------------------------------------------------------------
telegram:
  enabled: false
  # Run: python utils/key_encryptor.py  (it will prompt for bot token)
  bot_token_encrypted: ""
  # Your personal Telegram chat_id or a group chat_id (not sensitive).
  chat_id: ""
  # Language for messages: "zh" (Traditional Chinese) or "en" (English)
  language: "zh"

# ------------------------------------------------------------
# Simulation mode — paper trading with real market data.
# No orders are placed; P&L is tracked hypothetically.
# All Telegram notifications are sent with a [SIM] prefix.
# ------------------------------------------------------------
simulation:
  # Set to false when you are ready to trade with real money.
  enabled: true

# ------------------------------------------------------------
# Trading parameters
# ------------------------------------------------------------
trading:
  # Total deployable capital in USDC.
  total_capital_usdc: 166
  # Each side gets 50% of total capital.
  capital_split_hl: 0.50
  capital_split_aster: 0.50
  # Leverage on each side.
  # 3x is conservative; keeps margin ratio comfortable even at 0.5% adverse move.
  leverage: 3

  # --- Settlement-timed execution window ---
  # Enter position this many seconds BEFORE the Aster settlement time.
  entry_seconds_before_settlement: 15
  # Close position this many seconds AFTER the Aster settlement time.
  exit_seconds_after_settlement: 15
  # Evaluate opportunity this many seconds before settlement.
  # If spread is insufficient here, skip this cycle.
  evaluate_seconds_before_settlement: 60

  # --- Profitability threshold ---
  # Minimum NET spread (after all fees) to justify opening a position.
  # Break-even formula (taker both sides, 3x leverage):
  #   fees = (0.00045 + 0.00040) * 2 * 3 = 0.00510
  #   Set threshold comfortably above this: 0.0018 per 8h period (~0.054%/day)
  #   This is conservative — real spreads during funding spikes can be 0.5%+
  min_net_spread: 0.0018

  # Maximum simultaneous open arbitrage pairs.
  max_open_positions: 2

  # Maker order timeout before converting to aggressive limit (seconds).
  # Applies to HL only (Aster REST uses MARKET orders for speed).
  maker_timeout_seconds: 5

  # Price slippage buffer for HL aggressive limit fallback (basis points).
  aggressive_slippage_bps: 5

# ------------------------------------------------------------
# Risk controls
# ------------------------------------------------------------
risk:
  # If total session P&L drops below this fraction of capital, halt the bot.
  # e.g. 0.10 = stop if we lose more than 10% of 166u = $16.60
  max_drawdown_fraction: 0.10

  # Margin ratio below which we emergency-close (fraction 0-1).
  # Only relevant if holding through price volatility.
  min_margin_ratio: 0.20

# ------------------------------------------------------------
# Fee tiers — update if you qualify for a VIP tier on either exchange.
# ------------------------------------------------------------
fees:
  # Hyperliquid (Tier 0 / default)
  hl_maker_fee: 0.00015    # 0.015%
  hl_taker_fee: 0.00045    # 0.045%
  # Aster Pro Mode (VIP 1 / default)
  aster_maker_fee: 0.00005  # 0.005%
  aster_taker_fee: 0.00040  # 0.040%
  # Extra safety buffer on top of calculated fee cost (covers minor slippage).
  fee_safety_buffer: 0.0001

# ------------------------------------------------------------
# Symbol universe — symbols must exist on BOTH exchanges.
# Aster uses SYMBOL+USDT format internally (handled automatically).
# ------------------------------------------------------------
symbols:
  # If whitelist is non-empty, only these symbols are considered.
  whitelist:
    - "BTC"
    - "ETH"
    - "SOL"
    - "BNB"
  # Symbols to never trade regardless of spread.
  blacklist:
    - "DOGE"
    - "SHIB"
    - "PEPE"

# ------------------------------------------------------------
# Logging
# ------------------------------------------------------------
logging:
  level: "INFO"          # DEBUG | INFO | WARNING | ERROR
  log_file: "logs/arb_bot.log"
  max_bytes: 10485760    # 10 MB per file
  backup_count: 5
  json_logs: false       # Set true for log aggregators (Loki, Datadog)
